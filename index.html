        body {

        @keyframes marquee {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }

        .animate-marquee {
            display: flex;
            width: max-content;
            animation: marquee 60s linear infinite;
        }

        .product-oval {
            border-radius: 999px;
            aspect-ratio: 2 / 3;
        }
